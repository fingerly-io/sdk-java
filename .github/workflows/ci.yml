name: Java SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Built on each, always emitted for 11. 17 is the toolchain the build
        # declares; 21 guards against drift on a newer JDK.
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: bytecode and runtime dependencies
        run: scripts/verify-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: java-sdk-${{ matrix.java }}
          path: "*/build/libs/*.jar"
